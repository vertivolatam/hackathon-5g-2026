[package]
name = "esp32-p4-nano-fw"
version = "0.1.0"
edition = "2021"
description = "Firmware Rust no_std para Waveshare ESP32-P4-NANO / WIFI6-DB (ESP32-P4NRW32X + ESP32-C5/C6 SDIO, MIPI-DSI 10.1in, MIPI-CSI, Ethernet IP101GRI, ES8311, GT911)"
license = "MIT"

[dependencies]
# HAL principal. MIPI-DSI solo en `unstable` (merge esp-rs/esp-hal#5596, jun-2026, P4-only).
esp-hal = { version = "1.2", features = ["esp32p4", "unstable"] }
esp-alloc = { version = "0.11", features = ["esp32p4"] }
esp-backtrace = { version = "0.20", features = ["esp32p4", "panic-handler", "println"] }
esp-println = { version = "0.18", features = ["esp32p4", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32p4"] }
log = "0.4"

# Abstracciones pedidas por el usuario
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3"
embedded-graphics-core = "0.4.1"

# mipidsi 0.10.0 = MIPI Display Command Set sobre SPI / paralelo GPIO.
# IMPORTANTE: NO es MIPI-DSI serie nativo. Sirve como referencia de
# secuencias DCS (ST7789/ILI9341/...) y para paneles SPI auxiliares.
# El DSI nativo de 10.1" (JD9365/ILI9881C/EK79007) va por esp-hal::mipi_dsi (ver display_dsi.rs).
mipidsi = { version = "0.10", default-features = false }

heapless = "0.8"

[features]
# default = bring-up I2C + backlight + touch poll por log. Sin display.
default = []
# dsi = habilita pipeline nativo esp-hal::mipi_dsi (requiere PSRAM, panel 2-lane).
dsi = []
