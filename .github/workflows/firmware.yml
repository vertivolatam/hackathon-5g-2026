name: Firmware ESP32-P4-NANO (Python)

on:
  push:
    branches: [main]
    paths:
      - 'apps/esp-32/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'apps/esp-32/**'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile apps/esp-32/*.py apps/esp-32/drivers/*.py
      - run: python3 apps/esp-32/tests/test_smoke.py
      - run: python3 apps/esp-32/tests/test_dispenser.py
      - run: python3 apps/esp-32/tests/test_luz.py
