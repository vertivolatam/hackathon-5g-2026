name: Deploy landing + docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bio-trap/**'
      - 'docs-site/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Landing (raíz del sitio) ---
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bio-trap/package-lock.json
      - run: npm ci
        working-directory: bio-trap
      - run: npm run build-only
        working-directory: bio-trap

      # --- OpenAPI del backend -> Redoc estático ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python3 backend/scripts/export_openapi.py > /tmp/openapi.json
      - run: npx -y @redocly/cli@1 build-docs /tmp/openapi.json -o docs-site/static/api/index.html --title "BioTrap API"

      # --- Docs (subruta /docs/) ---
      - run: npm install
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site

      # --- Ensamblar un solo artefacto Pages ---
      - run: |
          mkdir -p site-root/docs
          cp -r bio-trap/dist/. site-root/
          cp -r docs-site/build/. site-root/docs/
          ls site-root site-root/docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-root

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
