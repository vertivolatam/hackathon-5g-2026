# Prometheus del stack dev: API FastAPI (/metrics) + Mosquitto vía exporter.
# En Minikube se usa backend/k8s/monitoring.yaml (mismos jobs, DNS del cluster).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: agrivision-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mosquitto
    static_configs:
      - targets: ["mosquitto-exporter:9234"]
