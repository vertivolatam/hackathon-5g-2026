# Landing estática (nginx) en Minikube. Se aplica junto a agrivision.yaml
# y monitoring.yaml con `make mk-apply` (o `make mk-all` de una vez).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: agrivision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
        - name: landing
          image: agrivision-landing:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: agrivision
spec:
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 80
---
# Landing accesible desde el host: NodePort 30080 -> 80
apiVersion: v1
kind: Service
metadata:
  name: landing-external
  namespace: agrivision
spec:
  type: NodePort
  selector:
    app: landing
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
