apiVersion: v1
kind: Namespace
metadata:
  name: agrivision
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-conf
  namespace: agrivision
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    listener 9001
    protocol websockets
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: agrivision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
            - containerPort: 9001
          volumeMounts:
            - name: conf
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: conf
          configMap:
            name: mosquitto-conf
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: agrivision
spec:
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: ws
      port: 9001
      targetPort: 9001
---
# MQTT accesible desde fuera del cluster (ESP32/gateway): NodePort 31883 -> 1883
apiVersion: v1
kind: Service
metadata:
  name: mosquitto-external
  namespace: agrivision
spec:
  type: NodePort
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: agrivision
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agrivision-api
  template:
    metadata:
      labels:
        app: agrivision-api
    spec:
      containers:
        - name: api
          image: agrivision-api:0.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MQTT_HOST
              value: "mosquitto.agrivision.svc.cluster.local"
            - name: MQTT_PORT
              value: "1883"
            - name: MQTT_TOPIC
              value: "agrivision/#"
            - name: ROBOFLOW_MODEL_ID
              value: "" # ej: tu-workspace/coffee-berry-borer/1 (Universe: ralph-matthew-r-aquino)
            - name: ROBOFLOW_CONFIDENCE
              value: "0.4"
            - name: ROBOFLOW_API_KEY
              valueFrom:
                secretKeyRef:
                  name: roboflow
                  key: api-key
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: agrivision
spec:
  selector:
    app: agrivision-api
  ports:
    - port: 8000
      targetPort: 8000
---
# API accesible desde el host: NodePort 30081 -> 8000
apiVersion: v1
kind: Service
metadata:
  name: api-external
  namespace: agrivision
spec:
  type: NodePort
  selector:
    app: agrivision-api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
