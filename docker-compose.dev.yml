# Stack de desarrollo: backend FastAPI + PostgreSQL + MQTT + Grafana
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "agrivision/#"
      DATABASE_URL: postgresql+psycopg://agrivision:agrivision@postgres:5432/agrivision
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-}
    depends_on:
      - postgres
      - mosquitto

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agrivision
      POSTGRES_PASSWORD: agrivision
      POSTGRES_DB: agrivision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  grafana-data:
