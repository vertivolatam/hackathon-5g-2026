# Stack de desarrollo: backend FastAPI + PostgreSQL + MQTT + Grafana
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Key persistente entre reboots/recreates (0600, gitignoreado).
    # Sin este archivo: ROBOFLOW_API_KEY queda vacío -> /api/detect da 503.
    env_file:
      - path: ./.roboflow.env
        required: false
    # Código montado en vivo: cambios en backend/*.py sin rebuild
    # (rebuild solo si cambia requirements.txt o el Dockerfile).
    volumes:
      - ./backend:/app
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: "agrivision/#"
      DATABASE_URL: postgresql+psycopg://agrivision:agrivision@postgres:5432/agrivision
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      FOTO_API_KEY: ${FOTO_API_KEY:-dev-trap-key}
      # ROBOFLOW_API_KEY viene SOLO de .roboflow.env (env_file arriba):
      # si se declara aquí vacía, pisa al archivo y /api/detect da 503.
      ROBOFLOW_MODEL_ID: ${ROBOFLOW_MODEL_ID:-}
      ROBOFLOW_WORKFLOW_ID: ${ROBOFLOW_WORKFLOW_ID:-vertivo-una-huerta-pensada-para-vos/agrivision-demo-hackathon-5g-2026}
      ALERT_CLASSES: ${ALERT_CLASSES:-broca,broca-cafe}
      ALERT_MIN_CONF: ${ALERT_MIN_CONF:-0.5}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      - postgres
      - mosquitto

  postgres:
    image: timescale/timescaledb:latest-pg16
    # Timescale exige la librería precargada (el volumen viejo se creó
    # con postgres pelado; este flag vale sin editar postgresql.conf).
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: agrivision
      POSTGRES_PASSWORD: agrivision
      POSTGRES_DB: agrivision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  # Métricas del broker para Prometheus (lee los topics $SYS del broker).
  # Imagen y flags según https://github.com/sapcc/mosquitto-exporter
  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:latest
    command: ["--endpoint", "tcp://mosquitto:1883", "--bind-address", "0.0.0.0:9234"]
    ports:
      - "9234:9234"
    depends_on:
      - mosquitto

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - mosquitto-exporter
      - backend

  # Inference Server self-hosted (CPU). Opt-in en dev:
  #   docker compose --profile inference up -d
  # y ROBOFLOW_URL=http://inference:9001 en el backend.
  # En Minikube es el default (ver backend/k8s/inference.yaml).
  inference:
    image: roboflow/roboflow-inference-server-cpu:latest
    profiles: ["inference"]
    ports:
      - "9001:9001"
    volumes:
      - inference-cache:/tmp:rw

  grafana:
    image: grafana/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Panel Business Media (fotos base64) del video de Volkov Labs.
      # (GF_INSTALL_PLUGINS está deprecado en Grafana 13.)
      GF_PLUGINS_PREINSTALL: volkovlabs-image-panel
      # Incrustación por iframe según
      # https://grafana.com/blog/how-to-embed-grafana-dashboards-into-web-applications/
      # Sin esto Grafana rechaza cualquier <iframe> (anti-clickjacking).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Auth anónima Viewer SOLO para dev: el iframe no pide login.
      # En producción usar snapshots, dashboards compartidos o proxy con auth.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - postgres
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

# Landing pública (estática). VITE_* se congela en BUILD: rebuild para cambiarla.
  landing:
    build:
      context: ./landing
      args:
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3000}
        VITE_GRAFANA_DASHBOARD_UID: ${VITE_GRAFANA_DASHBOARD_UID:-agrivision-detecciones}
    ports:
      - "${LANDING_PORT:-8080}:80"

volumes:
  pgdata:
  grafana-data:
  inference-cache:
